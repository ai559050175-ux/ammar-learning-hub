<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>منصة عمار التعليمية | Ammar Learning Hub</title>
<style>
:root{--bg1:#fff3c4;--bg2:#cfeeff;--ink:#27304d;--soft:#6b7494;--card:#ffffff;--c:#4d9bff;--c2:#2f6fe0;--gold:#ffc83d;--ok:#2ec27e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
html,body{margin:0;min-height:100%}
body{font-family:"Arial Rounded MT Bold","Trebuchet MS","Geeza Pro","Segoe UI",system-ui,sans-serif;color:var(--ink);
 background:linear-gradient(160deg,var(--bg2),var(--bg1));background-attachment:fixed;overflow-x:hidden;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.arab{direction:rtl;unicode-bidi:isolate;font-family:"Geeza Pro","Noto Naskh Arabic","Traditional Arabic","Arial",serif}
.quran{direction:rtl;unicode-bidi:isolate;font-family:"Amiri Quran","KFGQPC Uthmanic Script HAFS","Scheherazade New","Geeza Pro","Noto Naskh Arabic","Traditional Arabic",serif;line-height:2.1}
small{display:block;font-size:.5em;opacity:.7;font-weight:normal;line-height:1.2}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);box-shadow:0 3px 14px rgba(40,60,120,.12);flex-wrap:wrap}
.brand{flex:1;min-width:160px;font-size:24px;font-weight:bold;display:flex;align-items:center;gap:8px}
.brand span{background:linear-gradient(90deg,#ff7a59,#a66cff,#4d9bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{background:#fff;border-radius:30px;padding:0 18px;min-height:56px;display:flex;align-items:center;gap:8px;font-size:24px;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.ico{min-width:56px;min-height:56px;border-radius:50%;background:#fff;font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.12);padding:0 14px}
.ico:active,.btn:active,.card:active,.choice:active{transform:translateY(3px)}
.lang{border-radius:30px;font-weight:bold;font-size:20px;background:#ffe27a}

main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
h1,h2{margin:0}
.hello{display:flex;align-items:center;gap:16px;background:#fff;border-radius:28px;padding:16px 22px;margin-bottom:20px;box-shadow:0 8px 0 rgba(0,0,0,.08)}
.hello .mascot{font-size:64px;animation:bob 2.4s ease-in-out infinite}
.hello h2{font-size:30px}.hello p{margin:4px 0 0;color:var(--soft);font-size:20px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{position:relative;text-align:start;border-radius:30px;padding:22px;min-height:190px;color:#fff;
 background:linear-gradient(145deg,var(--c),var(--c2));box-shadow:0 10px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:transform .12s}
.card .big{font-size:70px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.card h3{margin:0;font-size:32px}.card .g{font-size:20px;opacity:.95}
.card .pr{margin-top:auto;display:flex;gap:6px;align-items:center;font-size:22px;background:rgba(255,255,255,.22);align-self:flex-start;padding:6px 16px;border-radius:20px}
.card::after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15)}

.lvhead{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.lvhead h2{font-size:32px;flex:1}
.btn{min-height:64px;padding:0 28px;border-radius:22px;font-size:24px;font-weight:bold;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15);transition:transform .1s}
.btn.pri{background:linear-gradient(145deg,#3ddc97,#1fa971);color:#fff}
.btn.sec{background:#ffd34d}
.btn.mini{min-height:56px;font-size:20px;padding:0 20px}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.lv{display:flex;gap:16px;align-items:center;text-align:start;background:#fff;border-radius:28px;padding:20px;min-height:130px;box-shadow:0 8px 0 rgba(0,0,0,.12);border:5px solid transparent;transition:transform .1s}
.lv .n{width:76px;height:76px;border-radius:24px;background:linear-gradient(145deg,var(--c),var(--c2));color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;flex:none}
.lv h3{margin:0;font-size:26px}.lv p{margin:4px 0 6px;color:var(--soft);font-size:18px}
.stars{font-size:30px;letter-spacing:2px}.stars .off{filter:grayscale(1);opacity:.3}
.badge{font-size:34px;margin-inline-start:auto}
.toggle{display:flex;gap:10px;background:#fff;border-radius:26px;padding:8px;box-shadow:0 5px 0 rgba(0,0,0,.1);margin-bottom:18px;flex-wrap:wrap}
.toggle button{flex:1;min-height:60px;border-radius:20px;background:#eef1fb;font-size:24px;font-weight:bold;padding:0 16px}
.toggle button.on{background:var(--c);color:#fff}

/* play */
.playtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.dots{display:flex;gap:8px;flex:1;justify-content:center}
.dots i{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
.dots i.done{background:var(--ok);box-shadow:none}.dots i.cur{background:var(--gold);transform:scale(1.25);box-shadow:none}
.qcard{background:#fff;border-radius:32px;padding:22px;box-shadow:0 10px 0 rgba(0,0,0,.12);animation:slide .35s ease}
.title{font-size:30px;font-weight:bold;text-align:center;margin:4px 0 12px;line-height:1.5}
.visual{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;min-height:120px;margin-bottom:14px;font-size:64px;text-align:center}
.visual .em{font-size:110px;line-height:1}
.visual .eq{font-size:64px;font-weight:bold;letter-spacing:4px;color:var(--c2)}
.visual .word{font-size:82px;font-weight:bold;letter-spacing:4px;color:var(--c2)}
.visual .sent{font-size:44px;font-weight:bold;line-height:1.5;color:var(--ink)}
.visual .vname{font-size:36px;font-weight:bold;width:100%}
.gap{display:inline-block;min-width:1.4em;border-bottom:8px dashed var(--gold);color:transparent;margin:0 4px}
.blank{display:inline-block;min-width:1.1em;border-bottom:8px dashed var(--gold);color:var(--c2);text-align:center}
.hl{color:#ff6f91}
.listen{min-height:72px;border-radius:36px;padding:0 34px;font-size:28px;font-weight:bold;background:linear-gradient(145deg,#ffd34d,#ffab1f);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.listen:active{transform:translateY(3px)}
.fb{background:#fff7d6;border-radius:16px;padding:8px 16px;font-size:20px;color:var(--soft)}
.choices{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:14px}
.choice,.vcard{min-width:0;overflow-wrap:anywhere}
.choice{min-height:92px;border-radius:26px;background:linear-gradient(180deg,#fff,#eef3ff);border:5px solid var(--c);font-size:38px;font-weight:bold;padding:10px 12px;box-shadow:0 7px 0 rgba(0,0,0,.14);transition:transform .1s,opacity .2s,background .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.35}
.choice.quranc{font-size:30px;font-weight:normal}
.choice.right{background:linear-gradient(180deg,#b9f6d4,#6fe3a5);border-color:var(--ok);animation:pop .5s}
.choice.wrong{opacity:.45;background:#fff4d6;border-color:#f6b73c;animation:wiggle .45s;pointer-events:none}
.choice.glow{animation:glow 1s infinite}
.choice .ic{font-size:44px}
.dot{display:inline-block}
.tenf{display:grid;grid-template-columns:repeat(5,34px);gap:6px;background:#eef3ff;padding:10px;border-radius:16px}
.frames{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;direction:ltr}
.tenf i{width:34px;height:34px;border-radius:50%;background:#e1e7f7}
.tenf i.on{background:#4d9bff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.tenf i.on2{background:#ff9f43;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.tenf i.cut{background:#cfd6ea;position:relative}
.tenf i.cut::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7a86a8;font-size:24px;font-style:normal}
.tenf i.q{background:transparent;border:3px dashed #f0b429}
svg.shape{width:150px;height:150px}

.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:#fff;border-radius:34px;padding:16px 34px;font-size:40px;font-weight:bold;box-shadow:0 14px 40px rgba(0,0,0,.25);z-index:50;pointer-events:none;animation:toast 1.2s forwards;text-align:center;max-width:90vw}
.toast.soft{background:#fff7e0;font-size:32px}

/* order game */
.bridge{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.slot{display:flex;gap:12px;align-items:center;min-height:84px;border-radius:22px;background:#eef3ff;border:4px dashed #b8c6ee;padding:8px 12px}
.slot .no{flex:none;width:48px;height:48px;border-radius:50%;background:var(--c);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
.slot .tx{flex:1;font-size:34px;text-align:center}
.slot.filled{background:linear-gradient(180deg,#d9fbe8,#b4f0cf);border:4px solid var(--ok);animation:pop .4s}
.slot.next{border-color:var(--gold);background:#fff9e0}
.pool{display:flex;flex-direction:column;gap:12px}
.vcard{min-height:76px;border-radius:24px;background:#fff;border:5px solid var(--c);font-size:32px;padding:6px 14px;box-shadow:0 6px 0 rgba(0,0,0,.14);text-align:center}
.vcard.wrong{animation:wiggle .45s;background:#fff4d6;border-color:#f6b73c}
.vcard.glow{animation:glow 1s infinite}
.rowc{display:flex;justify-content:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}

/* result */
.result{text-align:center;background:#fff;border-radius:34px;padding:30px 20px;box-shadow:0 10px 0 rgba(0,0,0,.12);animation:slide .4s}
.result h2{font-size:44px}
.result .stars{font-size:90px}
.result .stars span{display:inline-block;animation:starIn .6s both}
.result p{font-size:26px;margin:10px 0 20px}
.acts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.conf{position:fixed;top:-60px;z-index:40;font-size:34px;pointer-events:none;animation:fall linear forwards}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,40,80,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:#fff;border-radius:30px;padding:26px;max-width:480px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbox h3{margin:0 0 8px;font-size:30px}.mbox p{font-size:22px;color:var(--soft)}
.mbox input{width:140px;min-height:64px;font-size:34px;text-align:center;border-radius:18px;border:4px solid #c9d3f2;margin:8px 0 16px;direction:ltr;-webkit-user-select:text;user-select:text}
.note{color:var(--soft);font-size:18px;text-align:center;margin-top:20px}

@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes slide{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{40%{transform:scale(1.08)}}
@keyframes wiggle{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(255,200,61,.65),0 7px 0 rgba(0,0,0,.14)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes starIn{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
@media(max-width:640px){.choices[style*="--cols:4"]{grid-template-columns:repeat(2,minmax(0,1fr))}.choices[style*="--cols:3"]{grid-template-columns:minmax(0,1fr)}.choice .ic{font-size:36px}.visual .eq{font-size:48px}.brand{font-size:19px}.title{font-size:25px}.choice{font-size:30px;min-height:80px}.visual .em{font-size:84px}.visual .word{font-size:60px}.slot .tx{font-size:28px}.vcard{font-size:28px}.pill{font-size:20px;padding:0 12px}.tenf{grid-template-columns:repeat(5,26px)}.tenf i{width:26px;height:26px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="top" id="top"></div>
<main id="app"></main>
<script>
/* ===================== DATA ===================== */
const SURAHS=[
{id:'ikhlas',no:112,ar:'الإخلاص',en:'Al-Ikhlas',lvl:1,v:['قُلْ هُوَ ٱللَّهُ أَحَدٌ','ٱللَّهُ ٱلصَّمَدُ','لَمْ يَلِدْ وَلَمْ يُولَدْ','وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ'],
 clue:{ar:'سورة تقول: اللهُ أحد',en:'The surah that says: Allah is One',e:'☝️'}},
{id:'falaq',no:113,ar:'الفلق',en:'Al-Falaq',lvl:1,v:['قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ','مِن شَرِّ مَا خَلَقَ','وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ','وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ','وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ'],
 clue:{ar:'نستعيذ بربّ الصبح (الفلق)',en:'We ask protection from the Lord of the daybreak',e:'🌅'}},
{id:'nas',no:114,ar:'الناس',en:'An-Nas',lvl:1,v:['قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ','مَلِكِ ٱلنَّاسِ','إِلَٰهِ ٱلنَّاسِ','مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ','ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ','مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ'],
 clue:{ar:'نستعيذ بربّ الناس مَلِك الناس',en:'We seek refuge in the Lord, King and God of mankind',e:'🧑‍🤝‍🧑'}},
{id:'kawthar',no:108,ar:'الكوثر',en:'Al-Kawthar',lvl:1,v:['إِنَّآ أَعْطَيْنَٰكَ ٱلْكَوْثَرَ','فَصَلِّ لِرَبِّكَ وَٱنْحَرْ','إِنَّ شَانِئَكَ هُوَ ٱلْأَبْتَرُ'],
 clue:{ar:'سورة فيها نهر الكوثر في الجنة',en:'The surah of the river Al-Kawthar in Paradise',e:'🌊'}},
{id:'masad',no:111,ar:'المسد',en:'Al-Masad',lvl:1,v:['تَبَّتْ يَدَآ أَبِى لَهَبٍ وَتَبَّ','مَآ أَغْنَىٰ عَنْهُ مَالُهُۥ وَمَا كَسَبَ','سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ','وَٱمْرَأَتُهُۥ حَمَّالَةَ ٱلْحَطَبِ','فِى جِيدِهَا حَبْلٌ مِّن مَّسَدٍۭ'],
 clue:{ar:'سورة أبي لهب وامرأته',en:'The surah about Abu Lahab and his wife',e:'🔥'}},
{id:'nasr',no:110,ar:'النصر',en:'An-Nasr',lvl:1,v:['إِذَا جَآءَ نَصْرُ ٱللَّهِ وَٱلْفَتْحُ','وَرَأَيْتَ ٱلنَّاسَ يَدْخُلُونَ فِى دِينِ ٱللَّهِ أَفْوَاجًا','فَسَبِّحْ بِحَمْدِ رَبِّكَ وَٱسْتَغْفِرْهُ إِنَّهُۥ كَانَ تَوَّابًۢا'],
 clue:{ar:'سورة نصر الله والفتح',en:'The surah of Allah’s victory and the opening',e:'🏆'}},
{id:'asr',no:103,ar:'العصر',en:'Al-Asr',lvl:2,v:['وَٱلْعَصْرِ','إِنَّ ٱلْإِنسَٰنَ لَفِى خُسْرٍ','إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَتَوَاصَوْا۟ بِٱلْحَقِّ وَتَوَاصَوْا۟ بِٱلصَّبْرِ'],
 clue:{ar:'سورة أقسم الله فيها بالزمن',en:'Allah swears by time',e:'⏳'}},
{id:'fil',no:105,ar:'الفيل',en:'Al-Fil',lvl:2,v:['أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَٰبِ ٱلْفِيلِ','أَلَمْ يَجْعَلْ كَيْدَهُمْ فِى تَضْلِيلٍ','وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ','تَرْمِيهِم بِحِجَارَةٍ مِّن سِجِّيلٍ','فَجَعَلَهُمْ كَعَصْفٍ مَّأْكُولٍۭ'],
 clue:{ar:'سورة أصحاب الفيل والطير الأبابيل',en:'The surah of the elephant and the birds',e:'🐘'}},
{id:'quraysh',no:106,ar:'قريش',en:'Quraysh',lvl:2,v:['لِإِيلَٰفِ قُرَيْشٍ','إِۦلَٰفِهِمْ رِحْلَةَ ٱلشِّتَآءِ وَٱلصَّيْفِ','فَلْيَعْبُدُوا۟ رَبَّ هَٰذَا ٱلْبَيْتِ','ٱلَّذِىٓ أَطْعَمَهُم مِّن جُوعٍ وَءَامَنَهُم مِّنْ خَوْفٍۭ'],
 clue:{ar:'رحلة الشتاء والصيف',en:'The winter and summer journey',e:'🐪'}},

   const dp=shuffle(pool.flatMap(x=>x.v.map((y,i)=>({y,x,i}))).filter(o=>o.y!==v&&o.y!==nx&&o.y.length<=70&&o.y.length>=12));const ds=[];for(const o of dp){if(!ds.includes(o.y))ds.push(o.y);if(ds.length===3)break}
   return{key:'q4b:'+s.id+k,title:{ar:'ما الآية التي تأتي بعد هذه الآية؟',en:'Which verse comes next?'},visual:`<div class="quran" style="font-size:44px;line-height:2.2">${v}</div><div class="vname">${dualHTML(`من سورة ${s.ar}|From Surah ${s.en}`)}</div>`,speak:{t:v,l:'ar-SA',r:.7},fallback:'',
    choices:shuffle([nx,...ds]).map(x=>ch(`<span class="quran">${x}</span>`,x===nx,'quranc')),cols:1}}}
 const s=pick(pool.filter(x=>x.clue));return{key:'q4c:'+s.id,title:{ar:'خمّن السورة من التلميح',en:'Guess the surah from the clue'},visual:()=>`<div class="em">${s.clue.e}</div><div class="vname">${s.clue[state.lang]}</div>`,
  choices:shuffle([s,...sample(pool.filter(x=>x!==s),3)]).map(x=>ch(sname(x),x===s)),cols:2}}

const GEN={math:[null,math1,math2,math3,math4],english:[null,eng1,eng2,eng3,eng4],science:[null,sci1,sci2,sci3,sci4],arabic:[null,ar1,ar2,ar3,ar4],
 quran:[null,()=>quranOrder(1),()=>quranOrder(2),()=>quranOrder(3),quran4]};
const RECENT={};
function buildRound(subj,lvl){const n=ROUND_LEN(subj),used=new Set(),out=[],prev=new Set(RECENT[subj+lvl]||[]);
 for(let i=0;i<n;i++){let q,g=0;do{q=GEN[subj][lvl]();g++}while(g<60&&(used.has(q.key)||(g<25&&prev.has(q.key))));used.add(q.key);out.push(q)}
 RECENT[subj+lvl]=out.map(q=>q.key);return out}

/* ===================== UI ===================== */
let S={screen:'home'};
const app=()=>$('#app');
function applyLang(){document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='ar'?'rtl':'ltr'}
function setTheme(s){const r=document.documentElement.style;if(s){r.setProperty('--c',s.c);r.setProperty('--c2',s.c2)}else{r.setProperty('--c','#4d9bff');r.setProperty('--c2','#2f6fe0')}}
function renderTop(){$('#top').innerHTML=`<button class="ico" data-act="home" aria-label="home">🏠</button>
 <div class="brand">🎓 <span>${L('منصة عمّار التعليمية','Ammar Learning Hub')}</span></div>
 <div class="pill" title="${L('النجوم','Stars')}">⭐ ${totalStars()}</div><div class="pill" title="${L('الأوسمة','Badges')}">🏅 ${totalBadges()}</div>
 <button class="ico lang" data-act="lang">${state.lang==='ar'?'English':'العربية'}</button>
 <button class="ico" data-act="snd" aria-label="sound">${state.sound?'🔊':'🔇'}</button>
 <button class="ico" data-act="parent" aria-label="parent">⚙️</button>`}
function starsHTML(n,max){max=max||3;let h='<span class="stars">';for(let i=0;i<max;i++)h+=`<span class="${i<n?'':'off'}">⭐</span>`;return h+'</span>'}
function stopSpeech(){try{if(canSpeak())speechSynthesis.cancel()}catch(e){}}

function renderHome(){S={screen:'home'};stopSpeech();setTheme();renderTop();
 app().innerHTML=`<div class="hello"><div class="mascot">🦉</div><div><h2>${L('أهلًا يا عمّار! 👋','Hello Ammar! 👋')}</h2><p>${L('اختر لعبتك وجمّع النجوم والأوسمة','Pick a game and collect stars and badges')}</p></div></div>
 <div class="grid">${SUBJ.map(s=>`<button class="card" data-act="subj" data-id="${s.id}" style="--c:${s.c};--c2:${s.c2}"><div class="big">${s.icon}</div><h3>${tx(s.name)}</h3><div class="g">${tx(s.game)}</div><div class="g" style="opacity:.8;font-size:17px">${tx(s.sub)}</div><div class="pr">⭐ <span class="ltr">${subjStars(s.id)} / 12</span></div></button>`).join('')}</div>
 <div class="note">${L('يُحفظ تقدّم عمّار تلقائيًّا على هذا الجهاز','Ammar’s progress is saved automatically on this device')}</div>`}

function renderLevels(id){const s=SUBJ.find(x=>x.id===id);S={screen:'levels',subj:id};stopSpeech();setTheme(s);renderTop();
 const rng=id==='quran'?`<div class="toggle"><button data-act="rng" data-v="duha" class="${state.quranRange==='duha'?'on':''}">${L('من الضحى إلى الناس','Ad-Duha → An-Nas')}</button><button data-act="rng" data-v="ala" class="${state.quranRange==='ala'?'on':''}">${L('من الأعلى إلى الناس','Al-A’la → An-Nas')}</button></div>`:'';
 app().innerHTML=`<div class="lvhead"><button class="btn mini" data-act="home">${L('→ رجوع','← Back')}</button><h2>${s.icon} ${tx(s.game)}</h2></div>${rng}
 <div class="lvgrid">${[1,2,3,4].map(l=>{const p=getP(id,l);return `<button class="lv" data-act="lvl" data-l="${l}"><div class="n">${LVN[l-1].icon}</div><div style="flex:1"><h3>${L('المستوى','Level')} ${l} · ${tx(LVN[l-1])}</h3><p>${tx(LVD[id][l-1])}</p>${starsHTML(p.stars)}</div><div class="badge">${p.stars>=3?(l===4?'🏆':'🏅'):''}</div></button>`}).join('')}</div>
 <div class="note">${L('كل المستويات مفتوحة — الأسئلة تتغيّر في كل مرّة 🎲','All levels are open — questions change every time 🎲')}</div>`}

function startRound(subj,lvl){const sub=SUBJ.find(x=>x.id===subj);setTheme(sub);S={screen:'play',subj,lvl,qs:buildRound(subj,lvl),i:0,score:0,lock:false};renderPlay()}
function dotsHTML(){return `<div class="dots">${S.qs.map((q,i)=>`<i class="${i<S.i?'done':i===S.i?'cur':''}"></i>`).join('')}</div>`}
function listenHTML(q){if(!q.speak)return '';return `<div class="rowc"><button class="listen" data-act="listen">🔊 ${L('استمع','Listen')}</button>${!canSpeak()&&q.fallback?`<span class="fb">${L('الصوت غير متاح — الكلمة:','Sound not available — it says:')} ${q.fallback}</span>`:''}</div>`}
function renderPlay(){const q=S.qs[S.i];S.lock=false;S.tries=0;renderTop();
 const head=`<div class="playtop"><button class="btn mini" data-act="back">✕</button>${dotsHTML()}<div class="pill" style="min-height:56px;font-size:22px">⭐ ${S.score}</div></div>`;
 if(q.kind==='order'){S.ord={placed:0,mis:0,pool:shuffle(q.items)};if(q.items.length>1){let g=0;while(g++<20&&S.ord.pool.every((x,i)=>x===q.items[i]))S.ord.pool=shuffle(q.items)}
  app().innerHTML=head+`<div class="qcard"><div class="title">${tx(q.title)}</div><div class="rowc"><button class="listen" data-act="hint">🔊 ${L('استمع للآية التالية','Hear the next verse')}</button></div><div id="ord"></div></div>`;renderOrder();return}
 app().innerHTML=head+`<div class="qcard"><div class="title">${tx(q.title)}</div><div class="visual">${hh(q.visual)||''}</div>${listenHTML(q)}<div class="choices" style="--cols:${q.cols||2}">${q.choices.map((c,i)=>`<button class="choice ${c.cls}" data-act="ch" data-i="${i}">${hh(c.h)}</button>`).join('')}</div></div>`;
 if(q.speak&&q.auto&&canSpeak())setTimeout(()=>{if(S.qs&&S.qs[S.i]===q&&S.screen==='play')speak(q.speak.t,q.speak.l,q.speak.r)},500)}
function renderOrder(){const q=S.qs[S.i],o=S.ord;const slots=q.items.map((it,i)=>i<o.placed?`<div class="slot filled"><div class="no">${it.n}</div><div class="tx quran">${it.t}</div></div>`:`<div class="slot ${i===o.placed?'next':''}"><div class="no">${it.n}</div><div class="tx" style="color:#9aa6cf">…</div></div>`).join('');
 const cards=o.pool.filter(it=>!q.items.slice(0,o.placed).includes(it)).map(it=>`<button class="vcard quran ${o.mis>=2&&it===q.items[o.placed]?'glow':''}" data-act="vc" data-n="${it.n}">${it.t}</button>`).join('');
 $('#ord').innerHTML=`<div class="bridge">${slots}</div><div class="pool">${cards}</div>`}

function toast(msg,soft){const d=document.createElement('div');d.className='toast'+(soft?' soft':'');d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1250)}
const praise=()=>toast(tx(pick(PRAISE)));
const encourage=()=>toast(tx(pick(TRYAGAIN)),true);
function answer(i){if(S.lock)return;const q=S.qs[S.i],c=q.choices[i],el=document.querySelector(`.choice[data-i="${i}"]`);
 if(c.ok){S.lock=true;el.classList.add('right');SFX.ok();if(!S.tries)S.score++;praise();setTimeout(nextQ,1300)}
 else{S.tries++;el.classList.add('wrong');SFX.boing();encourage();if(S.tries>=2){const k=q.choices.findIndex(x=>x.ok);const g=document.querySelector(`.choice[data-i="${k}"]`);g&&g.classList.add('glow')}}}
function pickVerse(n){if(S.lock)return;const q=S.qs[S.i],o=S.ord,exp=q.items[o.placed];
 if(exp.n===n){SFX.place();o.placed++;if(o.placed===q.items.length){S.lock=true;renderOrder();if(!o.mis)S.score++;SFX.ok();praise();setTimeout(nextQ,1700)}else renderOrder()}
 else{o.mis++;SFX.boing();encourage();const el=document.querySelector(`.vcard[data-n="${n}"]`);if(el){el.classList.add('wrong');setTimeout(()=>{const e2=document.querySelector(`.vcard[data-n="${exp.n}"]`);if(o.mis>=2&&e2)e2.classList.add('glow')},50)}}}
function nextQ(){if(S.screen!=='play')return;S.i++;S.i>=S.qs.length?renderResult():renderPlay()}

function confetti(){const em=['⭐','🎉','🌟','✨','🎈','🍬','💫'];for(let i=0;i<46;i++){const d=document.createElement('div');d.className='conf';d.textContent=pick(em);d.style.left=rnd(0,98)+'%';d.style.animationDuration=(2+Math.random()*2.5)+'s';d.style.animationDelay=(Math.random()*.8)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5200)}}
function renderResult(again){const n=S.qs.length,r=S.score/n,stars=r>=.8?3:r>=.5?2:1;if(!again){setP(S.subj,S.lvl,stars);SFX.win();confetti()}S.screen='result';renderTop();stopSpeech();
 const sub=SUBJ.find(x=>x.id===S.subj),last=S.lvl>=4;const msg=stars===3?L('مذهل! أنت بطل حقيقي 🏆','Amazing! You are a real champion 🏆'):stars===2?L('عمل رائع! تقترب من النجمة الثالثة ⭐','Great work! The third star is near ⭐'):L('أحسنت! جرّب مرّة أخرى لتجمع نجومًا أكثر 💪','Well done! Try again to collect more stars 💪');
 app().innerHTML=`<div class="result"><div style="font-size:80px">${stars===3?'🏆':'🎉'}</div><h2>${L('انتهت الجولة!','Round complete!')}</h2><div class="stars">${[0,1,2].map(i=>`<span style="animation-delay:${i*.25}s;${i<stars?'':'filter:grayscale(1);opacity:.25'}">⭐</span>`).join('')}</div>
 <p>${msg}<br><b>${S.score} / ${n}</b> ${L('إجابات صحيحة من المحاولة الأولى','correct on the first try')}</p>
 ${stars===3&&last?`<p>🏅 ${L('وسام البطل في','Master badge for')} ${tx(sub.game)}!</p>`:''}
 <div class="acts"><button class="btn pri" data-act="again">🔄 ${L('العب مجدّدًا (أسئلة جديدة)','Play Again (New Questions)')}</button>${last?'':`<button class="btn sec" data-act="next">${L('المستوى التالي','Next Level')} ➜</button>`}<button class="btn" data-act="levels">${L('المستويات','Levels')}</button><button class="btn" data-act="home">🏠</button></div></div>`}

/* ---------- parent reset (two steps) ---------- */
function closeModal(){const m=$('#modal');if(m)m.remove()}
function parentModal(step,ctx){closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';
 if(step===1)m.innerHTML=`<div class="mbox"><h3>👨‍👩‍👦 ${L('منطقة الأهل','Parent area')}</h3><p>${L('هل تريد مسح كل النجوم والأوسمة والتقدّم؟','Do you want to erase all stars, badges and progress?')}</p><div class="acts"><button class="btn" data-act="mclose">${L('إلغاء','Cancel')}</button><button class="btn sec" data-act="mstep2">${L('متابعة','Continue')}</button></div></div>`;
 else{const a=rnd(11,19),b=rnd(12,19);m.dataset.ans=a+b;m.innerHTML=`<div class="mbox"><h3>🔒 ${L('تأكيد ثانٍ','Second confirmation')}</h3><p>${L('للتأكّد أنّك شخص بالغ، احسب:','To make sure you are a grown-up, solve:')}<br><b class="ltr" style="font-size:34px">${a} + ${b} = ?</b></p><input id="mans" inputmode="numeric" autocomplete="off"><div class="acts"><button class="btn" data-act="mclose">${L('إلغاء','Cancel')}</button><button class="btn pri" data-act="mreset">${L('نعم، امسح','Yes, erase')}</button></div></div>`}
 document.body.appendChild(m)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;ac();const a=t.dataset.act;
 switch(a){
  case 'home':closeModal();SFX.tap();renderHome();break;
  case 'subj':SFX.tap();renderLevels(t.dataset.id);break;
  case 'lvl':SFX.tap();startRound(S.subj,+t.dataset.l);break;
  case 'levels':renderLevels(S.subj);break;
  case 'back':stopSpeech();renderLevels(S.subj);break;
  case 'ch':answer(+t.dataset.i);break;
  case 'vc':pickVerse(+t.dataset.n);break;
  case 'listen':{const q=S.qs[S.i];if(q&&q.speak){if(!speak(q.speak.t,q.speak.l,q.speak.r))toast(L('الصوت غير متاح على هذا الجهاز','Sound is not available on this device'),true)}break}
  case 'hint':{const q=S.qs[S.i],ex=q.items[Math.min(S.ord.placed,q.items.length-1)];if(!speak(ex.t,'ar-SA',.65))toast(L('الصوت غير متاح — انظر إلى أرقام الآيات 👀','Sound not available — look at the verse numbers 👀'),true);break}
  case 'again':startRound(S.subj,S.lvl);break;
  case 'next':startRound(S.subj,S.lvl+1);break;
  case 'rng':state.quranRange=t.dataset.v;save();SFX.tap();renderLevels('quran');break;
  case 'lang':state.lang=state.lang==='ar'?'en':'ar';save();applyLang();rerender();break;
  case 'snd':state.sound=!state.sound;save();if(!state.sound)stopSpeech();renderTop();break;
  case 'parent':parentModal(1);break;
  case 'mclose':closeModal();break;
  case 'mstep2':parentModal(2);break;
  case 'mreset':{const m=$('#modal');if(+($('#mans').value||0)===+m.dataset.ans){state.prog={};save();closeModal();toast(L('تمّ مسح التقدّم','Progress erased'),true);renderHome()}else{SFX.boing();toast(L('إجابة غير صحيحة','Not correct'),true)}break}
 }});
function rerender(){
 if(S.screen==='home')renderHome();
 else if(S.screen==='levels')renderLevels(S.subj);
 else if(S.screen==='play'){const q=S.qs[S.i],lock=S.lock,tries=S.tries,ord=S.ord;renderPlay();S.lock=lock;S.tries=tries;if(q.kind==='order'){S.ord=ord;renderOrder()}}
 else if(S.screen==='result')renderResult(true)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech()});
applyLang();renderHome();
</script>
</body>
