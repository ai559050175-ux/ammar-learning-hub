<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>منصة عمار التعليمية | Ammar Learning Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Ammar Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4d9bff">
<style>
:root{--bg1:#fff3c4;--bg2:#cfeeff;--ink:#27304d;--soft:#6b7494;--card:#ffffff;--c:#4d9bff;--c2:#2f6fe0;--gold:#ffc83d;--ok:#2ec27e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
html,body{margin:0;min-height:100%}
body{font-family:"Arial Rounded MT Bold","Trebuchet MS","Geeza Pro","Segoe UI",system-ui,sans-serif;color:var(--ink);
 background:linear-gradient(160deg,var(--bg2),var(--bg1));background-attachment:fixed;overflow-x:hidden;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.arab{direction:rtl;unicode-bidi:isolate;font-family:"Geeza Pro","Noto Naskh Arabic","Traditional Arabic","Arial",serif}
.quran{direction:rtl;unicode-bidi:isolate;font-family:"Amiri Quran","KFGQPC Uthmanic Script HAFS","Scheherazade New","Geeza Pro","Noto Naskh Arabic","Traditional Arabic",serif;line-height:2.1}
small{display:block;font-size:.5em;opacity:.7;font-weight:normal;line-height:1.2}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);box-shadow:0 3px 14px rgba(40,60,120,.12);flex-wrap:wrap}
.brand{flex:1;min-width:160px;font-size:21px;white-space:nowrap;font-weight:bold;display:flex;align-items:center;gap:8px}
.brand span{color:#5b3fd4}
.pill{background:#fff;border-radius:30px;padding:0 18px;min-height:56px;display:flex;align-items:center;gap:8px;font-size:24px;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.ico{min-width:56px;min-height:56px;border-radius:50%;background:#fff;font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.12);padding:0 14px}
.ico:active,.btn:active,.card:active,.choice:active{transform:translateY(3px)}
.lang{border-radius:30px;font-weight:bold;font-size:20px;background:#ffe27a}

main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
h1,h2{margin:0}
.hello{display:flex;align-items:center;gap:16px;background:#fff;border-radius:28px;padding:16px 22px;margin-bottom:20px;box-shadow:0 8px 0 rgba(0,0,0,.08)}
.hello .mascot{font-size:64px;animation:bob 2.4s ease-in-out infinite}
.hello h2{font-size:30px}.hello p{margin:4px 0 0;color:var(--soft);font-size:20px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{position:relative;text-align:start;border-radius:30px;padding:22px;min-height:190px;color:#fff;
 background:linear-gradient(145deg,var(--c),var(--c2));box-shadow:0 10px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:transform .12s}
.card .big{font-size:70px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.card h3{margin:0;font-size:32px}.card .g{font-size:20px;opacity:.95}
.card .pr{margin-top:auto;display:flex;gap:6px;align-items:center;font-size:22px;background:rgba(255,255,255,.22);align-self:flex-start;padding:6px 16px;border-radius:20px}
.card::after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15)}

.lvhead{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.lvhead h2{font-size:32px;flex:1}
.btn{min-height:64px;padding:0 28px;border-radius:22px;font-size:24px;font-weight:bold;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15);transition:transform .1s}
.btn.pri{background:linear-gradient(145deg,#3ddc97,#1fa971);color:#fff}
.btn.sec{background:#ffd34d}
.btn.mini{min-height:56px;font-size:20px;padding:0 20px}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.lv{display:flex;gap:16px;align-items:center;text-align:start;background:#fff;border-radius:28px;padding:20px;min-height:130px;box-shadow:0 8px 0 rgba(0,0,0,.12);border:5px solid transparent;transition:transform .1s}
.lv .n{width:76px;height:76px;border-radius:24px;background:linear-gradient(145deg,var(--c),var(--c2));color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;flex:none}
.lv h3{margin:0;font-size:26px}.lv p{margin:4px 0 6px;color:var(--soft);font-size:18px}
.stars{font-size:30px;letter-spacing:2px}.stars .off{filter:grayscale(1);opacity:.3}
.badge{font-size:34px;margin-inline-start:auto}
.toggle{display:flex;gap:10px;background:#fff;border-radius:26px;padding:8px;box-shadow:0 5px 0 rgba(0,0,0,.1);margin-bottom:18px;flex-wrap:wrap}
.toggle button{flex:1;min-height:60px;border-radius:20px;background:#eef1fb;font-size:24px;font-weight:bold;padding:0 16px}
.toggle button.on{background:var(--c);color:#fff}

/* play */
.playtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.dots{display:flex;gap:8px;flex:1;justify-content:center}
.dots i{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
.dots i.done{background:var(--ok);box-shadow:none}.dots i.cur{background:var(--gold);transform:scale(1.25);box-shadow:none}
.qcard{background:#fff;border-radius:32px;padding:22px;box-shadow:0 10px 0 rgba(0,0,0,.12);animation:slide .35s ease}
.title{font-size:30px;font-weight:bold;text-align:center;margin:4px 0 12px;line-height:1.5}
.visual{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;min-height:120px;margin-bottom:14px;font-size:64px;text-align:center}
.visual .em{font-size:110px;line-height:1}
.visual .eq{font-size:64px;font-weight:bold;letter-spacing:4px;color:var(--c2)}
.visual .word{font-size:82px;font-weight:bold;letter-spacing:4px;color:var(--c2)}
.visual .sent{font-size:44px;font-weight:bold;line-height:1.5;color:var(--ink)}
.visual .vname{font-size:36px;font-weight:bold;width:100%}
.gap{display:inline-block;min-width:1.4em;border-bottom:8px dashed var(--gold);color:transparent;margin:0 4px}
.blank{display:inline-block;min-width:1.1em;border-bottom:8px dashed var(--gold);color:var(--c2);text-align:center}
.hl{color:#ff6f91}
.listen{min-height:72px;border-radius:36px;padding:0 34px;font-size:28px;font-weight:bold;background:linear-gradient(145deg,#ffd34d,#ffab1f);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.listen:active{transform:translateY(3px)}
.fb{background:#fff7d6;border-radius:16px;padding:8px 16px;font-size:20px;color:var(--soft)}
.choices{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:14px}
.choice,.vcard{min-width:0;overflow-wrap:anywhere}
.choice{min-height:92px;border-radius:26px;background:linear-gradient(180deg,#fff,#eef3ff);border:5px solid var(--c);font-size:38px;font-weight:bold;padding:10px 12px;box-shadow:0 7px 0 rgba(0,0,0,.14);transition:transform .1s,opacity .2s,background .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.35}
.choice.quranc{font-size:30px;font-weight:normal}
.choice.right{background:linear-gradient(180deg,#b9f6d4,#6fe3a5);border-color:var(--ok);animation:pop .5s}
.choice.wrong{opacity:.45;background:#fff4d6;border-color:#f6b73c;animation:wiggle .45s;pointer-events:none}
.choice.glow{animation:glow 1s infinite}
.choice.sel{background:linear-gradient(180deg,#d9e8ff,#a9c8ff);box-shadow:0 0 0 6px var(--c),0 7px 0 rgba(0,0,0,.14);transform:translateY(2px)}
.tkgo{margin:16px auto 0;display:block}
.mwrap{position:relative;display:flex;gap:70px;direction:ltr;margin:6px 0}
.mcol{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.mchoice{min-height:78px;font-size:26px;flex-direction:row;gap:10px;position:relative;z-index:2}
.mchoice .ic{font-size:40px}
.mchoice.mdone{pointer-events:none}
.mchoice.shk{animation:wiggle .45s}
.spslots,.sptiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.sps{width:52px;height:62px;border:4px solid var(--c);border-radius:14px;font-size:36px;font-weight:bold;background:#fff}
.sps.ok{background:#b9f6d4;border-color:var(--ok)}.sps.bad{background:#fff4d6;border-color:#f6b73c;animation:wiggle .45s}
.spt{width:56px;height:64px;border-radius:16px;font-size:36px;font-weight:bold;background:linear-gradient(180deg,#fff,#eef3ff);border:4px solid var(--c);box-shadow:0 5px 0 rgba(0,0,0,.14)}.spt:disabled{opacity:.2;box-shadow:none}
@media(max-width:640px){.sps{width:32px;height:44px;font-size:24px}.spt{width:40px;height:48px;font-size:26px}.toggle button{font-size:19px;padding:0 8px}}
.extab td{font-size:22px;padding:6px 10px}
.mlines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.choice .ic{font-size:44px}
.dot{display:inline-block}
.tenf{display:grid;grid-template-columns:repeat(5,34px);gap:6px;background:#eef3ff;padding:10px;border-radius:16px}
.frames{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;direction:ltr}
.tenf i{width:34px;height:34px;border-radius:50%;background:#e1e7f7}
.tenf i.on{background:#4d9bff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.tenf i.on2{background:#ff9f43;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.tenf i.cut{background:#cfd6ea;position:relative}
.tenf i.cut::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7a86a8;font-size:24px;font-style:normal}
.tenf i.q{background:transparent;border:3px dashed #f0b429}
/* heroes — medals, panel, gallery */
.medal{--bw:4px;position:relative;display:inline-grid;place-items:center;width:var(--ms,80px);aspect-ratio:1;border-radius:50%;flex:none;
 background:radial-gradient(circle at 32% 26%,color-mix(in srgb,var(--m1) 62%,#fff),var(--m1) 46%,var(--m2));border:var(--bw) solid #ffd45c;
 box-shadow:inset 0 0 0 2px rgba(120,80,0,.35),inset 0 -6px 10px rgba(0,0,0,.18),0 5px 10px rgba(30,40,90,.28)}
.medal .mi{display:block;width:92%;height:92%;border-radius:50%;overflow:hidden}.medal .mi.v{width:80%;height:80%;overflow:visible}
.medal .mi svg{display:block;width:100%;height:100%}
.medal.sm{--ms:100%;--bw:2.5px}.medal.lg{--ms:118px;--bw:6px}.medal.xl{--ms:116px;--bw:6px}
.medal.lock{background:radial-gradient(circle at 32% 26%,#eef1fa,#cdd3e6);border-color:#bcc4dc;box-shadow:inset 0 0 0 2px rgba(80,90,130,.18),0 3px 6px rgba(30,40,90,.12)}
.medal.lock .mi svg{filter:brightness(0);opacity:.16}
.medal .mk{position:absolute;inset-inline-end:-2px;bottom:-2px;width:34%;aspect-ratio:1;display:grid;place-items:center;font-size:clamp(9px,1.6vw,16px);background:#fff;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.hpanel{background:#fff;border-radius:30px;padding:18px;margin-bottom:22px;box-shadow:0 8px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;gap:16px}
.hp-top{display:flex;align-items:center;gap:18px}
.hp-buddy{background:none;padding:0;border-radius:50%;flex:none;animation:bob 2.6s ease-in-out infinite}
.hp-info{flex:1;min-width:0}.hp-info h2{font-size:30px;line-height:1.2}.hp-info p{margin:4px 0 10px;color:var(--soft);font-size:19px}
.hp-prog{display:flex;align-items:center;gap:12px;font-weight:bold;font-size:19px}
.hp-prog .bar,.card .bar{flex:1;height:14px;border-radius:9px;background:#e6ebf7;overflow:hidden}
.hp-prog .bar i{display:block;height:100%;min-width:14px;background:linear-gradient(90deg,#ffd34d,#ff9f43);border-radius:9px}
.hp-next{margin-top:8px;font-size:17px;color:var(--soft)}
.hp-shelf{display:flex;flex-direction:column;gap:10px;width:100%;text-align:start;padding:12px 14px 14px;border-radius:22px;background:linear-gradient(180deg,#eef2ff,#e0e7ff);box-shadow:inset 0 3px 8px rgba(60,80,160,.16)}
.hp-head{display:flex;justify-content:space-between;align-items:center;font-size:18px;color:#3a43c9}.hp-head>span:last-child{font-weight:bold}
.hp-row{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
.hgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}@media(max-width:760px){.hgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hc{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:5px solid transparent;border-radius:26px;padding:16px 8px 14px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.08);font-family:inherit;color:var(--ink)}
.hc.sel{border-color:var(--gold);background:#fffbea}.hc:disabled{cursor:default}
.hc .nm{font-weight:bold;font-size:20px;margin-top:8px}.hc .sb{color:var(--soft);font-size:16px}
.hc .hp{width:100%;background:#fff;border-radius:18px;padding:6px;box-shadow:inset 0 0 0 3px #ffe6f1}.hc .hp svg{display:block;width:100%;max-width:130px;height:auto;margin:0 auto}.hc.lock .hp svg{filter:brightness(0);opacity:.15}
.sech{font-size:22px;margin:18px 0 10px}.hgrid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:760px){.hgrid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pill.small{min-height:44px;font-size:20px;padding:0 16px}
.card .bar{height:10px;background:rgba(255,255,255,.3);min-width:40px}.card .bar i{display:block;height:100%;background:#fff;border-radius:6px}
.card .pr{gap:10px;font-size:19px;width:100%;align-self:stretch;border-radius:18px}
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{min-height:200px}
/* colouring studio */
.cstudio{display:grid;gap:16px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
.cpaper{background:#fff;border-radius:26px;padding:12px;box-shadow:0 8px 0 rgba(0,0,0,.1),inset 0 0 0 4px #ffe6f1}
.ctools{background:#fff;border-radius:26px;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;gap:14px}
.cprog{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:bold}.cprog .bar{flex:1;height:16px;border-radius:10px;background:#ffe6f1;overflow:hidden}.cprog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7ab8,#ff9f43);border-radius:10px;transition:width .3s}
.ctools .pal{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:10px}
.ctools .sw{width:100%;max-width:60px;aspect-ratio:1;height:auto;border-width:4px;justify-self:center}
.ctools .acts{display:flex;gap:10px;flex-wrap:wrap}.ctools .btn{min-height:56px;font-size:19px;padding:0 16px;flex:1}
.cwin{background:#fffbea;border:4px dashed var(--gold);border-radius:22px;padding:10px 14px;text-align:center;font-size:22px;font-weight:bold}
.r.pop{animation:pop .3s ease-out}@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@media(max-width:900px){.cstudio{grid-template-columns:1fr}}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{min-height:170px;padding:16px}.card h3{font-size:24px}.card .g{font-size:16px}.card .big{font-size:50px}.card .pr{font-size:16px;padding:6px 12px}}
@media(max-width:520px){.hp-row{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.medal.xl{--ms:92px}.hp-info h2{font-size:24px}.hp-info p{font-size:16px;margin-bottom:8px}.hpanel{padding:14px}
 .top{gap:5px;padding:8px 8px;flex-wrap:nowrap}.brand{display:none}.top .pill{min-height:40px;font-size:16px;padding:0 8px;gap:3px;flex:none}.top .ico{min-width:40px;min-height:40px;font-size:18px;padding:0 6px;flex:none}.top .lang{font-size:13px;padding:0 10px;margin-inline-start:auto}.card .pr{padding:6px 10px;gap:6px}.card .pr .ltr{white-space:nowrap}.card .bar{min-width:18px}}
.hc,.hp-shelf,.hp-buddy{cursor:pointer}
svg.shape{width:150px;height:150px}
svg.nl{width:100%;height:auto;display:block}.nlw{width:100%;max-width:480px;margin:0 auto}
.bt{display:inline-flex;gap:12px;align-items:flex-end;direction:ltr;background:#eef3ff;padding:10px 12px;border-radius:14px}
.bt .tens{display:flex;gap:5px}.bt .rod{display:block;width:14px;height:70px;border-radius:4px;background:repeating-linear-gradient(to bottom,#4d9bff 0 6px,#2f6fe0 6px 7px)}
.bt .ones{display:grid;grid-template-columns:repeat(5,14px);gap:4px}.bt .ones i{width:14px;height:14px;background:#ff9f43;border-radius:3px}
.cmp{display:flex;align-items:center;justify-content:center;gap:14px;direction:ltr;flex-wrap:wrap}.cmp .q{font-size:48px;font-weight:bold;color:#f0b429}
.pairs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:420px;direction:ltr}.pairs .pr{display:flex;gap:4px;padding:6px 8px;background:#eef3ff;border-radius:12px}.pairs .pr i{width:28px;height:28px;border-radius:50%;background:#4d9bff}
.erow{display:flex;flex-wrap:wrap;justify-content:center;font-size:32px;line-height:1.2;direction:ltr;max-width:230px;padding:6px 8px;border-radius:12px}.erow.g1{background:#eef3ff}.erow.g2{background:#fff3e0}
.addp{direction:ltr;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.addp .pl{font-size:44px;font-weight:bold;color:var(--c2)}


.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:#fff;border-radius:34px;padding:16px 34px;font-size:40px;font-weight:bold;box-shadow:0 14px 40px rgba(0,0,0,.25);z-index:50;pointer-events:none;animation:toast 1.2s forwards;text-align:center;max-width:90vw}
.toast.soft{background:#fff7e0;font-size:32px}

/* order game */
.bridge{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.slot{display:flex;gap:12px;align-items:center;min-height:84px;border-radius:22px;background:#eef3ff;border:4px dashed #b8c6ee;padding:8px 12px}
.slot .no{flex:none;width:48px;height:48px;border-radius:50%;background:var(--c);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
.slot .tx{flex:1;font-size:34px;text-align:center}
.slot.filled{background:linear-gradient(180deg,#d9fbe8,#b4f0cf);border:4px solid var(--ok);animation:pop .4s}
.slot.next{border-color:var(--gold);background:#fff9e0}
.pool{display:flex;flex-direction:column;gap:12px}
.vcard{min-height:76px;border-radius:24px;background:#fff;border:5px solid var(--c);font-size:32px;padding:6px 14px;box-shadow:0 6px 0 rgba(0,0,0,.14);text-align:center}
.vcard.wrong{animation:wiggle .45s;background:#fff4d6;border-color:#f6b73c}
.vcard.glow{animation:glow 1s infinite}
.rowc{display:flex;justify-content:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}

/* result */
.result{text-align:center;background:#fff;border-radius:34px;padding:30px 20px;box-shadow:0 10px 0 rgba(0,0,0,.12);animation:slide .4s}
.result h2{font-size:44px}
.result .stars{font-size:90px}
.result .stars span{display:inline-block;animation:starIn .6s both}
.result p{font-size:26px;margin:10px 0 20px}
.acts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.conf{position:fixed;top:-60px;z-index:40;font-size:34px;pointer-events:none;animation:fall linear forwards}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,40,80,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:#fff;border-radius:30px;padding:26px;max-width:480px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbox h3{margin:0 0 8px;font-size:30px}.mbox p{font-size:22px;color:var(--soft)}
.mbox.pm{text-align:start;max-height:92vh;overflow:auto}.pms{background:#f4f6ff;border-radius:20px;padding:14px;margin:12px 0}.pms b{font-size:21px}.pms p{margin:6px 0 10px;font-size:18px}.pms .acts{display:flex;gap:8px;flex-wrap:wrap}.pms .btn{min-height:52px;font-size:18px;padding:0 14px;flex:1}.pms textarea{width:100%;font:14px/1.4 ui-monospace,Menlo,monospace;direction:ltr;border:3px solid #c9d3f2;border-radius:14px;padding:8px;margin-bottom:10px;-webkit-user-select:text;user-select:text;resize:none}.pmsg{text-align:center;font-size:20px;font-weight:bold;color:var(--ok);margin:6px 0}
.mbox input{width:140px;min-height:64px;font-size:34px;text-align:center;border-radius:18px;border:4px solid #c9d3f2;margin:8px 0 16px;direction:ltr;-webkit-user-select:text;user-select:text}
.note{color:var(--soft);font-size:18px;text-align:center;margin-top:20px}

@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes slide{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{40%{transform:scale(1.08)}}
@keyframes wiggle{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(255,200,61,.65),0 7px 0 rgba(0,0,0,.14)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes starIn{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
@media(max-width:640px){.choices[style*="--cols:4"]{grid-template-columns:repeat(2,minmax(0,1fr))}.choices[style*="--cols:3"]{grid-template-columns:minmax(0,1fr)}.choice .ic{font-size:36px}.visual .eq{font-size:48px}.brand{font-size:19px}.title{font-size:25px}.choice{font-size:30px;min-height:80px}.visual .em{font-size:84px}.visual .word{font-size:60px}.slot .tx{font-size:28px}.vcard{font-size:28px}.pill{font-size:20px;padding:0 12px}.tenf{grid-template-columns:repeat(5,26px)}.tenf i{width:26px;height:26px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:640px;margin:0 auto}
.mc{aspect-ratio:1;perspective:600px;background:none;padding:0;border-radius:20px}
.mf{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.flip .mf{transform:rotateY(180deg)}
.mb,.mfr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 6px 0 rgba(0,0,0,.14);font-size:clamp(34px,9vw,64px)}
.mb{background:linear-gradient(145deg,var(--c),var(--c2));color:#fff}
.mfr{background:#fff;transform:rotateY(180deg);border:4px solid #dfe6fb}
.mc.done .mfr{background:#d9fbe8;border-color:#6fe3a5}
#csvg{width:100%;height:auto;display:block;background:#fff;border-radius:20px}
.r{fill:#fff;stroke:#27304d;stroke-width:3;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
.pal{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.sw{width:60px;height:60px;border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 3px #c9d3f2,0 4px 0 rgba(0,0,0,.12);font-size:26px}
.sw.on{box-shadow:0 0 0 6px var(--c2),0 4px 0 rgba(0,0,0,.12);transform:scale(1.1)}
.bodywrap{display:flex;justify-content:center}
.bodysvg{width:100%;max-width:300px;max-height:62vh;height:auto;display:block;background:#f3fbff;border-radius:24px;padding:6px}
.bodysvg.static{max-width:190px;pointer-events:none}
.bodysvg .bp{cursor:pointer;stroke:#27304d;stroke-width:3;stroke-linejoin:round;transition:stroke .15s}
.bodysvg .hit{fill:transparent;stroke:none;cursor:pointer}
.bodysvg .dec{pointer-events:none}
.bodysvg .okp{stroke:#1fa971!important;stroke-width:9!important}
.bodysvg .nop{stroke:#f6b73c!important;stroke-width:9!important}
.bodysvg .glowp,.bodysvg .hl{stroke:#ffb300!important;stroke-width:9!important;animation:hlp 1s infinite}
@keyframes hlp{50%{stroke-width:4}}

{id:"qadr",no:97,ar:"القدر",en:"Al-Qadr",lvl:3,v:["إِنَّآ أَنزَلْنَٰهُ فِى لَيْلَةِ ٱلْقَدْرِ","وَمَآ أَدْرَىٰكَ مَا لَيْلَةُ ٱلْقَدْرِ","لَيْلَةُ ٱلْقَدْرِ خَيْرٌۭ مِّنْ أَلْفِ شَهْرٍۢ","تَنَزَّلُ ٱلْمَلَٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍۢ","سَلَٰمٌ هِىَ حَتَّىٰ مَطْلَعِ ٱلْفَجْرِ"],
 clue:{"ar":"ليلة خير من ألف شهر","en":"The night better than a thousand months","e":"🌙"}},
{id:"alaq",no:96,ar:"العلق",en:"Al-Alaq",lvl:3,v:["ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِى خَلَقَ","خَلَقَ ٱلْإِنسَٰنَ مِنْ عَلَقٍ","ٱقْرَأْ وَرَبُّكَ ٱلْأَكْرَمُ","ٱلَّذِى عَلَّمَ بِٱلْقَلَمِ","عَلَّمَ ٱلْإِنسَٰنَ مَا لَمْ يَعْلَمْ","كَلَّآ إِنَّ ٱلْإِنسَٰنَ لَيَطْغَىٰٓ","أَن رَّءَاهُ ٱسْتَغْنَىٰٓ","إِنَّ إِلَىٰ رَبِّكَ ٱلرُّجْعَىٰٓ","أَرَءَيْتَ ٱلَّذِى يَنْهَىٰ","عَبْدًا إِذَا صَلَّىٰٓ","أَرَءَيْتَ إِن كَانَ عَلَى ٱلْهُدَىٰٓ","أَوْ أَمَرَ بِٱلتَّقْوَىٰٓ","أَرَءَيْتَ إِن كَذَّبَ وَتَوَلَّىٰٓ","أَلَمْ يَعْلَم بِأَنَّ ٱللَّهَ يَرَىٰ","كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعًۢا بِٱلنَّاصِيَةِ","نَاصِيَةٍۢ كَٰذِبَةٍ خَاطِئَةٍۢ","فَلْيَدْعُ نَادِيَهُۥ","سَنَدْعُ ٱلزَّبَانِيَةَ","كَلَّا لَا تُطِعْهُ وَٱسْجُدْ وَٱقْتَرِب ۩"],
 clue:{"ar":"اقرأ باسم ربك الذي خلق","en":"Read in the name of your Lord who created","e":"📖"}},
{id:"sharh",no:94,ar:"الشرح",en:"Ash-Sharh",lvl:3,v:["أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ","وَوَضَعْنَا عَنكَ وِزْرَكَ","ٱلَّذِىٓ أَنقَضَ ظَهْرَكَ","وَرَفَعْنَا لَكَ ذِكْرَكَ","فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا","إِنَّ مَعَ ٱلْعُسْرِ يُسْرًۭا","فَإِذَا فَرَغْتَ فَٱنصَبْ","وَإِلَىٰ رَبِّكَ فَٱرْغَب"],
 clue:{"ar":"إنّ مع العسر يسرًا","en":"Indeed, with hardship comes ease","e":"💖"}},
{id:"duha",no:93,ar:"الضحى",en:"Ad-Duha",lvl:3,v:["وَٱلضُّحَىٰ","وَٱلَّيْلِ إِذَا سَجَىٰ","مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ","وَلَلْءَاخِرَةُ خَيْرٌۭ لَّكَ مِنَ ٱلْأُولَىٰ","وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰٓ","أَلَمْ يَجِدْكَ يَتِيمًۭا فَـَٔاوَىٰ","وَوَجَدَكَ ضَآلًّۭا فَهَدَىٰ","وَوَجَدَكَ عَآئِلًۭا فَأَغْنَىٰ","فَأَمَّا ٱلْيَتِيمَ فَلَا تَقْهَرْ","وَأَمَّا ٱلسَّآئِلَ فَلَا تَنْهَرْ","وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ"],
 clue:{"ar":"والضحى والليل إذا سجى","en":"By the morning brightness and the calm night","e":"☀️"}},
{id:"tin",no:95,ar:"التين",en:"At-Tin",lvl:3,v:["وَٱلتِّينِ وَٱلزَّيْتُونِ","وَطُورِ سِينِينَ","وَهَٰذَا ٱلْبَلَدِ ٱلْأَمِينِ","لَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ فِىٓ أَحْسَنِ تَقْوِيمٍۢ","ثُمَّ رَدَدْنَٰهُ أَسْفَلَ سَٰفِلِينَ","إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍۢ","فَمَا يُكَذِّبُكَ بَعْدُ بِٱلدِّينِ","أَلَيْسَ ٱللَّهُ بِأَحْكَمِ ٱلْحَٰكِمِينَ"],
 clue:{"ar":"والتين والزيتون","en":"By the fig and the olive","e":"🫒"}},
{id:"takathur",no:102,ar:"التكاثر",en:"At-Takathur",lvl:3,v:["أَلْهَىٰكُمُ ٱلتَّكَاثُرُ","حَتَّىٰ زُرْتُمُ ٱلْمَقَابِرَ","كَلَّا سَوْفَ تَعْلَمُونَ","ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ","كَلَّا لَوْ تَعْلَمُونَ عِلْمَ ٱلْيَقِينِ","لَتَرَوُنَّ ٱلْجَحِيمَ","ثُمَّ لَتَرَوُنَّهَا عَيْنَ ٱلْيَقِينِ","ثُمَّ لَتُسْـَٔلُنَّ يَوْمَئِذٍ عَنِ ٱلنَّعِيمِ"],
 clue:{"ar":"ألهاكم التكاثر حتى زرتم المقابر","en":"Competing for more distracts you until you visit the graves","e":"🏦"}},
{id:"kafirun",no:109,ar:"الكافرون",en:"Al-Kafirun",lvl:4,noOrder:true,v:["قُلْ يَٰٓأَيُّهَا ٱلْكَٰفِرُونَ","لَآ أَعْبُدُ مَا تَعْبُدُونَ","وَلَآ أَنتُمْ عَٰبِدُونَ مَآ أَعْبُدُ","وَلَآ أَنَا۠ عَابِدٌۭ مَّا عَبَدتُّمْ","وَلَآ أَنتُمْ عَٰبِدُونَ مَآ أَعْبُدُ","لَكُمْ دِينُكُمْ وَلِىَ دِينِ"],
 clue:{"ar":"لكم دينكم ولي دين","en":"To you your religion, and to me mine","e":"🕌"}},
{id:"ala",no:87,ar:"الأعلى",en:"Al-A’la",lvl:3,ala:true,v:["سَبِّحِ ٱسْمَ رَبِّكَ ٱلْأَعْلَى","ٱلَّذِى خَلَقَ فَسَوَّىٰ","وَٱلَّذِى قَدَّرَ فَهَدَىٰ","وَٱلَّذِىٓ أَخْرَجَ ٱلْمَرْعَىٰ","فَجَعَلَهُۥ غُثَآءً أَحْوَىٰ","سَنُقْرِئُكَ فَلَا تَنسَىٰٓ","إِلَّا مَا شَآءَ ٱللَّهُ ۚ إِنَّهُۥ يَعْلَمُ ٱلْجَهْرَ وَمَا يَخْفَىٰ","وَنُيَسِّرُكَ لِلْيُسْرَىٰ","فَذَكِّرْ إِن نَّفَعَتِ ٱلذِّكْرَىٰ","سَيَذَّكَّرُ مَن يَخْشَىٰ","وَيَتَجَنَّبُهَا ٱلْأَشْقَى","ٱلَّذِى يَصْلَى ٱلنَّارَ ٱلْكُبْرَىٰ","ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ","قَدْ أَفْلَحَ مَن تَزَكَّىٰ","وَذَكَرَ ٱسْمَ رَبِّهِۦ فَصَلَّىٰ","بَلْ تُؤْثِرُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا","وَٱلْءَاخِرَةُ خَيْرٌۭ وَأَبْقَىٰٓ","إِنَّ هَٰذَا لَفِى ٱلصُّحُفِ ٱلْأُولَىٰ","صُحُفِ إِبْرَٰهِيمَ وَمُوسَىٰ"],
 clue:{"ar":"سبّح اسم ربك الأعلى","en":"Glorify the name of your Lord, the Most High","e":"🕊️"}},
{id:"ghashiyah",no:88,ar:"الغاشية",en:"Al-Ghashiyah",lvl:3,ala:true,v:["هَلْ أَتَىٰكَ حَدِيثُ ٱلْغَٰشِيَةِ","وُجُوهٌۭ يَوْمَئِذٍ خَٰشِعَةٌ","عَامِلَةٌۭ نَّاصِبَةٌۭ","تَصْلَىٰ نَارًا حَامِيَةًۭ","تُسْقَىٰ مِنْ عَيْنٍ ءَانِيَةٍۢ","لَّيْسَ لَهُمْ طَعَامٌ إِلَّا مِن ضَرِيعٍۢ","لَّا يُسْمِنُ وَلَا يُغْنِى مِن جُوعٍۢ","وُجُوهٌۭ يَوْمَئِذٍۢ نَّاعِمَةٌۭ","لِّسَعْيِهَا رَاضِيَةٌۭ","فِى جَنَّةٍ عَالِيَةٍۢ","لَّا تَسْمَعُ فِيهَا لَٰغِيَةًۭ","فِيهَا عَيْنٌۭ جَارِيَةٌۭ","فِيهَا سُرُرٌۭ مَّرْفُوعَةٌۭ","وَأَكْوَابٌۭ مَّوْضُوعَةٌۭ","وَنَمَارِقُ مَصْفُوفَةٌۭ","وَزَرَابِىُّ مَبْثُوثَةٌ","أَفَلَا يَنظُرُونَ إِلَى ٱلْإِبِلِ كَيْفَ خُلِقَتْ","وَإِلَى ٱلسَّمَآءِ كَيْفَ رُفِعَتْ","وَإِلَى ٱلْجِبَالِ كَيْفَ نُصِبَتْ","وَإِلَى ٱلْأَرْضِ كَيْفَ سُطِحَتْ","فَذَكِّرْ إِنَّمَآ أَنتَ مُذَكِّرٌۭ","لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍ","إِلَّا مَن تَوَلَّىٰ وَكَفَرَ","فَيُعَذِّبُهُ ٱللَّهُ ٱلْعَذَابَ ٱلْأَكْبَرَ","إِنَّ إِلَيْنَآ إِيَابَهُمْ","ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُم"],
 clue:{"ar":"أفلا ينظرون إلى الإبل كيف خلقت","en":"Do they not look at the camels, how they were created?","e":"🐫"}},
{id:"fajr",no:89,ar:"الفجر",en:"Al-Fajr",lvl:3,ala:true,v:["وَٱلْفَجْرِ","وَلَيَالٍ عَشْرٍۢ","وَٱلشَّفْعِ وَٱلْوَتْرِ","وَٱلَّيْلِ إِذَا يَسْرِ","هَلْ فِى ذَٰلِكَ قَسَمٌۭ لِّذِى حِجْرٍ","أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ","إِرَمَ ذَاتِ ٱلْعِمَادِ","ٱلَّتِى لَمْ يُخْلَقْ مِثْلُهَا فِى ٱلْبِلَٰدِ","وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ","وَفِرْعَوْنَ ذِى ٱلْأَوْتَادِ","ٱلَّذِينَ طَغَوْا۟ فِى ٱلْبِلَٰدِ","فَأَكْثَرُوا۟ فِيهَا ٱلْفَسَادَ","فَصَبَّ عَلَيْهِمْ رَبُّكَ سَوْطَ عَذَابٍ","إِنَّ رَبَّكَ لَبِٱلْمِرْصَادِ","فَأَمَّا ٱلْإِنسَٰنُ إِذَا مَا ٱبْتَلَىٰهُ رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّىٓ أَكْرَمَنِ","وَأَمَّآ إِذَا مَا ٱبْتَلَىٰهُ فَقَدَرَ عَلَيْهِ رِزْقَهُۥ فَيَقُولُ رَبِّىٓ أَهَٰنَنِ","كَلَّا ۖ بَل لَّا تُكْرِمُونَ ٱلْيَتِيمَ","وَلَا تَحَٰٓضُّونَ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ","وَتَأْكُلُونَ ٱلتُّرَاثَ أَكْلًۭا لَّمًّۭا","وَتُحِبُّونَ ٱلْمَالَ حُبًّۭا جَمًّۭا","كَلَّآ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّۭا دَكًّۭا","وَجَآءَ رَبُّكَ وَٱلْمَلَكُ صَفًّۭا صَفًّۭا","وَجِا۟ىٓءَ يَوْمَئِذٍۭ بِجَهَنَّمَ ۚ يَوْمَئِذٍۢ يَتَذَكَّرُ ٱلْإِنسَٰنُ وَأَنَّىٰ لَهُ ٱلذِّكْرَىٰ","يَقُولُ يَٰلَيْتَنِى قَدَّمْتُ لِحَيَاتِى","فَيَوْمَئِذٍۢ لَّا يُعَذِّبُ عَذَابَهُۥٓ أَحَدٌۭ","وَلَا يُوثِقُ وَثَاقَهُۥٓ أَحَدٌۭ","يَٰٓأَيَّتُهَا ٱلنَّفْسُ ٱلْمُطْمَئِنَّةُ","ٱرْجِعِىٓ إِلَىٰ رَبِّكِ رَاضِيَةًۭ مَّرْضِيَّةًۭ","فَٱدْخُلِى فِى عِبَٰدِى","وَٱدْخُلِى جَنَّتِى"],
 clue:{"ar":"والفجر وليالٍ عشر","en":"By the dawn and the ten nights","e":"🌄"}},
{id:"balad",no:90,ar:"البلد",en:"Al-Balad",lvl:3,ala:true,v:["لَآ أُقْسِمُ بِهَٰذَا ٱلْبَلَدِ","وَأَنتَ حِلٌّۢ بِهَٰذَا ٱلْبَلَدِ","وَوَالِدٍۢ وَمَا وَلَدَ","لَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ فِى كَبَدٍ","أَيَحْسَبُ أَن لَّن يَقْدِرَ عَلَيْهِ أَحَدٌۭ","يَقُولُ أَهْلَكْتُ مَالًۭا لُّبَدًا","أَيَحْسَبُ أَن لَّمْ يَرَهُۥٓ أَحَدٌ","أَلَمْ نَجْعَل لَّهُۥ عَيْنَيْنِ","وَلِسَانًۭا وَشَفَتَيْنِ","وَهَدَيْنَٰهُ ٱلنَّجْدَيْنِ","فَلَا ٱقْتَحَمَ ٱلْعَقَبَةَ","وَمَآ أَدْرَىٰكَ مَا ٱلْعَقَبَةُ","فَكُّ رَقَبَةٍ","أَوْ إِطْعَٰمٌۭ فِى يَوْمٍۢ ذِى مَسْغَبَةٍۢ","يَتِيمًۭا ذَا مَقْرَبَةٍ","أَوْ مِسْكِينًۭا ذَا مَتْرَبَةٍۢ","ثُمَّ كَانَ مِنَ ٱلَّذِينَ ءَامَنُوا۟ وَتَوَاصَوْا۟ بِٱلصَّبْرِ وَتَوَاصَوْا۟ بِٱلْمَرْحَمَةِ","أُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلْمَيْمَنَةِ","وَٱلَّذِينَ كَفَرُوا۟ بِـَٔايَٰتِنَا هُمْ أَصْحَٰبُ ٱلْمَشْـَٔمَةِ","عَلَيْهِمْ نَارٌۭ مُّؤْصَدَةٌۢ"],

const getP=(s,l)=>(state.prog[s]&&state.prog[s][l])||{stars:0,plays:0};
function setP(s,l,stars){state.prog[s]=state.prog[s]||{};const p=getP(s,l);state.prog[s][l]={stars:Math.max(p.stars,stars),plays:p.plays+1};save()}
const subjStars=s=>[1,2,3,4].reduce((n,l)=>n+getP(s,l).stars,0);
const totalStars=()=>ALLS.reduce((n,s)=>n+subjStars(s.id),0)+(state.bonus||0);
const totalBadges=()=>ALLS.reduce((n,s)=>n+[1,2,3,4].filter(l=>getP(s.id,l).stars>=3).length,0);

/* ===================== GENERATORS ===================== */
const frames=items=>{let h='<div class="frames">';for(let i=0;i<items.length;i+=10)h+='<div class="tenf">'+items.slice(i,i+10).map(c=>`<i class="${c}"></i>`).join('')+'</div>';return h+'</div>'};
const rep=(c,n)=>Array(Math.max(0,n)).fill(c);
function numCh(ans,min,max){const s=new Set([ans]);let g=0;while(s.size<4&&g++<300){const d=ans+pick([-4,-3,-2,-1,1,2,3,4]);if(d>=min&&d<=max)s.add(d)}return shuffle([...s]).map(n=>ch(`<span class="ltr">${n}</span>`,n===ans))}
const N=n=>`<span class="ltr">${n}</span>`;

/* ===== Math — Year 1 · Term 1 (Weeks 4–12 lessons) =====
   L1 Numbers & counting · L2 Tens & ones · L3 Addition within 20 · L4 Subtraction within 20 + 2D/3D shapes */
const MITEMS=[['🐦','birds','طيور'],['⭐','stickers','ملصقات'],['🍎','apples','تفاح'],['🎈','balloons','بالونات'],['🚗','toy cars','سيارات'],['🍪','biscuits','بسكويت'],['🐸','frogs','ضفادع'],['🧸','teddy bears','دببة']];
/* number line: hops of 1 from `from` to `to`; hideEnd shows "?" at the end */
function nline(from,to,hideEnd){
 const lo=Math.max(0,Math.min(from,to)-1),hi=Math.min(20,Math.max(from,to)+1),n=hi-lo,W=480,pad=24,sp=(W-2*pad)/n,X=v=>pad+(v-lo)*sp,Y=62,st=to>from?1:-1;
 let s=`<svg viewBox="0 0 ${W} 100" class="nl" role="img"><line x1="${pad-14}" y1="${Y}" x2="${W-pad+14}" y2="${Y}" stroke="#8a93b2" stroke-width="3" stroke-linecap="round"/>`;
 for(let v=from;v!==to;v+=st){const x1=X(v),x2=X(v+st),m=(x1+x2)/2;s+=`<path d="M${x1} ${Y-8} Q${m} ${Y-48} ${x2} ${Y-8}" fill="none" stroke="#ff9f43" stroke-width="4" stroke-linecap="round"/>`}
 for(let v=lo;v<=hi;v++){const x=X(v),on=v===from,end=v===to;
  s+=`<line x1="${x}" y1="${Y-8}" x2="${x}" y2="${Y+8}" stroke="#8a93b2" stroke-width="3"/>`;
  if(on)s+=`<circle cx="${x}" cy="${Y}" r="9" fill="#4d9bff"/>`;
  if(end)s+=hideEnd?`<circle cx="${x}" cy="${Y}" r="9" fill="#fff" stroke="#f0b429" stroke-width="3" stroke-dasharray="4 3"/>`:`<circle cx="${x}" cy="${Y}" r="9" fill="#3ddc97"/>`;
  s+=`<text x="${x}" y="${Y+36}" text-anchor="middle" font-size="20" font-weight="700" fill="${on?'#2f6fe0':'#44507a'}">${end&&hideEnd?'?':v}</text>`}
 return `<div class="nlw ltr">${s}</svg></div>`}
/* base-ten blocks: rods = tens, small squares = ones */
const bt=n=>{const t=Math.floor(n/10),o=n%10;return `<div class="bt"><div class="tens">${'<b class="rod"></b>'.repeat(t)}</div><div class="ones">${'<i></i>'.repeat(o)}</div></div>`};
const erow=(e,n,cls)=>`<div class="erow ${cls||''}">${Array(n).fill(e).join('')}</div>`;
const eqv=t=>`<div class="eq ltr">${t}</div>`;
const symCh=a=>[['<','&lt;'],['>','&gt;'],['=','=']].map(([s,h])=>ch(`<span class="ltr" style="font-size:44px">${h}</span>`,s===a));

/* ---- Level 1 · Numbers & counting (W4, W8, W11) ---- */
function m1count(){const a=rnd(3,15),to=Math.min(20,a+rnd(2,5)),k=to-a;
 return{key:'m1c:'+a+'+'+k,title:{ar:`ابدأ من ${N(a)} وعُدّ للأمام ${N(k)}. إلى أي عدد وصلت؟`,en:`Start at ${N(a)}. Count on ${N(k)} more. What number do you reach?`},visual:nline(a,to,true),choices:numCh(to,0,20),cols:4}}
function m1ba(){const af=Math.random()<.5,n=af?rnd(0,19):rnd(1,20),ans=af?n+1:n-1;
 return{key:'m1ba:'+(af?'a':'b')+n,title:{ar:`ما العدد الذي يأتي ${af?'بعد':'قبل'} ${N(n)}؟`,en:`What number comes ${af?'after':'before'} ${N(n)}?`},visual:eqv(af?`${n} ➜ ?`:`? ➜ ${n}`),choices:numCh(ans,0,20),cols:4}}
function m1pm(){const more=Math.random()<.5,n=more?rnd(1,19):rnd(2,20),ans=more?n+1:n-1;
 return{key:'m1pm:'+(more?'m':'l')+n,title:{ar:`ما العدد الذي هو واحد ${more?'أكثر':'أقل'} من ${N(n)}؟`,en:`What is one ${more?'more':'less'} than ${N(n)}?`},visual:frames(more?[...rep('on',n),'q']:[...rep('on',n-1),'cut']),choices:numCh(ans,0,20),cols:4}}
function m1oe(){const n=rnd(1,10);const pr=[];for(let i=0;i<n;i+=2)pr.push(`<span class="pr"><i></i>${i+1<n?'<i></i>':''}</span>`);
 return{key:'m1oe:'+n,title:{ar:`هل العدد ${N(n)} فردي أم زوجي؟`,en:`Is ${N(n)} odd or even?`},visual:`<div class="pairs">${pr.join('')}</div>`,
  choices:[ch(D('زوجي — لكل واحد رفيق|Even — everyone has a buddy'),n%2===0),ch(D('فردي — واحد وحده|Odd — one is left alone'),n%2===1)],cols:1}}
function m1ord(){const ns=sample(Array.from({length:20},(_,i)=>i+1),4),asc=[...ns].sort((a,b)=>a-b),t=rnd(0,3);
 const vis=eqv(ns.join(' · ')).replace('class="eq ltr"','class="eq ltr" style="font-size:46px"');
 if(t<2){const sm=t===0;return{key:'m1o:'+t+ns.join(),title:{ar:sm?'ما أصغر عدد؟':'ما أكبر عدد؟',en:sm?'Which is the smallest number?':'Which is the greatest number?'},visual:vis,choices:shuffle(ns).map(x=>ch(`<span class="ltr">${x}</span>`,x===(sm?asc[0]:asc[3]))),cols:4}}
 const up=t===2,good=up?asc:[...asc].reverse(),seen=new Set([good.join()]),opts=[good];
 const bad=[[...good].reverse()];seen.add(bad[0].join());let g=0;while(bad.length<3&&g++<80){const x=shuffle(ns);if(!seen.has(x.join())){seen.add(x.join());bad.push(x)}}
 return{key:'m1s:'+t+ns.join(),title:{ar:up?'أيّ صفّ مرتّب من الأصغر إلى الأكبر؟':'أيّ صفّ مرتّب من الأكبر إلى الأصغر؟',en:up?'Which row is in order from smallest to greatest?':'Which row is in order from greatest to smallest?'},visual:'<div class="em">🔢</div>',
  choices:shuffle([good,...bad]).map(x=>ch(`<span class="ltr">${x.join(' , ')}</span>`,x.join()===good.join())),cols:1}}
const mathL1=()=>pick([m1count,m1ba,m1pm,m1oe,m1ord,m1ba,m1pm])();

/* ---- Level 2 · Tens & ones (W4–W6, W8) ---- */
function digCh(n){const s=new Set([n]),r=+String(n).split('').reverse().join('');[r,n+1,n-1,n+10,n-10,n+9].forEach(x=>{if(x>=1&&x<=30&&s.size<4)s.add(x)});return shuffle([...s]).map(x=>ch(`<span class="ltr">${x}</span>`,x===n))}
function m2tens(){const n=rnd(10,30),t=Math.floor(n/10),o=n%10,ask=Math.random()<.5;
 return{key:'m2t:'+(ask?'t':'o')+n,title:{ar:`كم ${ask?'عشرة':'واحدًا (آحادًا)'} في العدد ${N(n)}؟`,en:`How many ${ask?'tens':'ones'} are there in the number ${N(n)}?`},visual:bt(n)+eqv(n),choices:ask?numCh(t,0,4):numCh(o,0,9),cols:4}}
function m2build(){const n=rnd(11,30),t=Math.floor(n/10),o=n%10;
 if(Math.random()<.5)return{key:'m2b:'+n,title:{ar:'ما العدد الذي تُظهره المكعّبات؟ (العصا = ١٠ والمربّع = ١)',en:'What number do the base-ten blocks show? (rod = 10, square = 1)'},visual:bt(n),choices:digCh(n),cols:4};
 return{key:'m2w:'+n,title:{ar:`معي ${N(t)} من العشرات و${N(o)} من الآحاد. ما العدد؟`,en:`I have ${N(t)} tens and ${N(o)} ones. What number am I?`},visual:bt(n),choices:digCh(n),cols:4}}
function m2val(){const t=rnd(1,2),o=rnd(1,9),n=t*10+o;if(o===t)return m2val();const ask=Math.random()<.5,d=ask?t:o,sp=x=>`<span class="ltr">${x}</span>`;
 const mk=(v,pos)=>ch(D(`${sp(v)} من ${pos?'العشرات':'الآحاد'}|${v} ${pos?'tens':'ones'}`),v===d&&!!pos===ask);
 return{key:'m2v:'+n+ask,title:{ar:`في العدد ${N(n)}، ماذا يمثّل الرقم ${N(d)}؟`,en:`In the number ${N(n)}, what does the digit ${N(d)} stand for?`},visual:eqv(n),choices:[mk(t,1),mk(t,0),mk(o,1),mk(o,0)],cols:2}}
function m2cmp(){let a=rnd(10,30),b;const r=Math.random();if(r<.15)b=a;else if(r<.5){const tt=Math.min(2,Math.floor(a/10));a=tt*10+rnd(0,9);b=tt*10+rnd(0,9)}else b=rnd(10,30);
 const ans=a<b?'<':a>b?'>':'=';
 return{key:'m2c:'+a+'_'+b,title:{ar:'قارن بين العددين: اختر < أو > أو =',en:'Compare the numbers: choose <, > or ='},visual:`<div class="cmp">${bt(a)}<span class="q">?</span>${bt(b)}</div>`+eqv(`${a} ? ${b}`),choices:symCh(ans),cols:3}}
function m2part(){let n=rnd(11,29);if(n===20)n=21;const t=Math.floor(n/10)*10,o=n%10;
 if(Math.random()<.5)return{key:'m2p:o'+n,title:{ar:'جزّئ العدد إلى عشرات وآحاد',en:'Partition the number into tens and ones'},visual:bt(n)+eqv(`${n} = ${t} + ?`),choices:numCh(o,0,9),cols:4};
 const c=new Set([t]);shuffle([10,20,30,o]).forEach(x=>{if(c.size<4)c.add(x)});
 return{key:'m2p:t'+n,title:{ar:'جزّئ العدد إلى عشرات وآحاد',en:'Partition the number into tens and ones'},visual:bt(n)+eqv(`${n} = ? + ${o}`),choices:shuffle([...c]).map(x=>ch(`<span class="ltr">${x}</span>`,x===t)),cols:4}}
const mathL2=()=>pick([m2tens,m2build,m2val,m2cmp,m2part,m2cmp,m2build])();

/* ---- Level 3 · Addition within 20 (W8–W9, lessons 1–3) ---- */
function m3parts(){const p=rnd(2,12),q=rnd(2,Math.min(9,20-p)),w=p+q;
 if(Math.random()<.5)return{key:'m3p:'+p+'+'+q,title:{ar:'اجمع الجزأين. كم الكلّ؟',en:'Combine the two parts. What is the whole?'},visual:eqv(`${p} + ${q} = ?`)+frames([...rep('on',p),...rep('on2',q)]),choices:numCh(w,0,20),cols:4};
 return{key:'m3pm:'+w+'-'+p,title:{ar:'الكلّ معروف وأحد الجزأين معروف. ما الجزء الناقص؟',en:'The whole and one part are known. What is the missing part?'},visual:eqv(`${w} = ${p} + ?`)+frames([...rep('on',p),...rep('q',q)]),choices:numCh(q,0,20),cols:4}}
function m3pic(){const [e]=pick(MITEMS),a=rnd(2,10),b=rnd(2,Math.min(10,20-a));
 return{key:'m3i:'+e+a+'+'+b,title:{ar:'عُدّ كل الصور. كم المجموع؟',en:'Count all the pictures. How many in all?'},visual:`<div class="addp">${erow(e,a,'g1')}<span class="pl">+</span>${erow(e,b,'g2')}</div>`+eqv(`${a} + ${b} = ?`),choices:numCh(a+b,0,20),cols:4}}
function m3nl(){const a=rnd(0,15),b=rnd(1,Math.min(5,20-a));
 return{key:'m3n:'+a+'+'+b,title:{ar:'استخدم خطّ الأعداد: عُدّ للأمام لتجد الناتج',en:'Use the number line: count forward to find the answer'},visual:nline(a,a+b,true)+eqv(`${a} + ${b} = ?`),choices:numCh(a+b,0,20),cols:4}}
function m3finger(){
 if(Math.random()<.5){const a=rnd(2,9);let b=rnd(2,9);if(b===a)b=a===9?8:a+1;const big=Math.max(a,b),sm=Math.min(a,b),c=new Set([big,sm]);[big+sm,big-sm,big+1,sm+1].forEach(x=>{if(x>0&&c.size<4)c.add(x)});
  return{key:'m3f:'+a+'+'+b,title:{ar:`لنحسب ${N(a)} + ${N(b)} بالأصابع: أيّ عدد نحتفظ به في عقولنا؟ (الأكبر)`,en:`To add ${N(a)} + ${N(b)} with fingers, which number do we keep in our mind?`},visual:eqv(`${a} + ${b}`)+'<div class="em">✋</div>',choices:shuffle([...c]).map(x=>ch(`<span class="ltr">${x}</span>`,x===big)),cols:4}}
 const a=rnd(6,13),b=rnd(2,Math.min(6,20-a));
 return{key:'m3fs:'+a+'+'+b,title:{ar:`فكّر في ${N(a)} ثم عُدّ ${N(b)} بأصابعك`,en:`Think ${N(a)}, then count on ${N(b)} fingers`},visual:eqv(`${a} + ${b} = ?`)+'<div class="em">🧠✋</div>',choices:numCh(a+b,0,20),cols:4}}
function m3miss(){const b=rnd(1,9),a=rnd(1,Math.min(11,20-b)),s=a+b;
 return{key:'m3m:'+a+'+'+b,title:{ar:'أوجد العدد الناقص',en:'Find the missing number'},visual:eqv(`${a} + ? = ${s}`),choices:numCh(b,0,20),cols:4}}
function m3zero(){
 if(Math.random()<.25)return{key:'m3zc',title:{ar:'ماذا يحدث عندما نجمع صفرًا إلى عدد؟',en:'What happens when we add zero to a number?'},visual:eqv('7 + 0'),choices:shuffle([ch(D('العدد لا يتغيّر|The number stays the same'),1),ch(D('يصبح العدد أكبر|The number gets bigger'),0),ch(D('يصبح العدد أصغر|The number gets smaller'),0),ch(D('يصبح العدد صفرًا|The number becomes zero'),0)]),cols:1};
 const n=rnd(1,20),f=Math.random()<.5;return{key:'m3z:'+n+f,title:{ar:'اجمع (قاعدة الصفر)',en:'Add (the zero rule)'},visual:eqv(f?`${n} + 0 = ?`:`0 + ${n} = ?`),choices:numCh(n,0,20),cols:4}}
function mword(add){const [e,en,ar]=pick(MITEMS);
 if(add){const a=rnd(3,14),b=rnd(2,Math.min(8,20-a));return{key:'m3w:'+e+a+'+'+b,title:{ar:`يوجد ${N(a)} من ${ar}، وجاء ${N(b)} أخرى معها. كم صار المجموع؟`,en:`There are ${N(a)} ${en}. ${N(b)} more come. How many are there now?`},visual:`<div class="em">${e}</div>`,choices:numCh(a+b,0,20),cols:4}}
 const a=rnd(8,20),b=rnd(2,Math.min(9,a-1));return{key:'m4w:'+e+a+'-'+b,title:{ar:`يوجد ${N(a)} من ${ar}، ثم ذهب ${N(b)} منها. كم بقي؟`,en:`There are ${N(a)} ${en}. ${N(b)} go away. How many are left?`},visual:`<div class="em">${e}</div>`,choices:numCh(a-b,0,20),cols:4}}
const mathL3=()=>pick([m3parts,m3pic,m3nl,m3finger,m3miss,m3zero,()=>mword(true),m3nl,m3parts])();

/* ---- Level 4 · Subtraction within 20 (W11–W12) + 2D / 3D shapes ---- */
function m4take(){const a=rnd(5,20),b=rnd(1,Math.min(9,a-1));
 return{key:'m4t:'+a+'-'+b,title:{ar:`كان هناك ${N(a)} قطعة. أُخذ منها ${N(b)}. كم بقي؟`,en:`There were ${N(a)} counters. ${N(b)} are taken away. How many are left?`},visual:eqv(`${a} − ${b} = ?`)+frames([...rep('on',a-b),...rep('cut',b)]),choices:numCh(a-b,0,20),cols:4}}
function m4back(){const a=rnd(6,20),b=rnd(1,5);
 return{key:'m4b:'+a+'-'+b,title:{ar:'استخدم خطّ الأعداد: عُدّ للخلف لتجد الناتج',en:'Use the number line: count back to find the answer'},visual:nline(a,a-b,true)+eqv(`${a} − ${b} = ?`),choices:numCh(a-b,0,20),cols:4}}
function m4diff(){const a=rnd(10,20),s=rnd(Math.max(4,a-8),a-2);
 return{key:'m4d:'+a+'-'+s,title:{ar:`لنحسب ${N(a)} − ${N(s)}: ابدأ من العدد الأصغر ${N(s)} وعُدّ للأمام حتى ${N(a)}. كم قفزة؟`,en:`To solve ${N(a)} − ${N(s)}, start at the smaller number ${N(s)} and count on to ${N(a)}. How many jumps?`},visual:nline(s,a,false)+eqv(`${a} − ${s} = ?`),choices:numCh(a-s,0,20),cols:4}}
function m4zero(){
 if(Math.random()<.25)return{key:'m4zc',title:{ar:'ماذا يعني أن نطرح صفرًا من عدد؟',en:'What does it mean to take away zero?'},visual:eqv('9 − 0'),choices:shuffle([ch(D('لا يُزال أيّ شيء|Nothing is taken away'),1),ch(D('نُزيل كل شيء|Everything is taken away'),0),ch(D('الناتج صفر|The answer is zero'),0),ch(D('يزداد العدد|The number gets bigger'),0)]),cols:1};
 const n=rnd(1,20);return{key:'m4z:'+n,title:{ar:'اطرح (الصفر)',en:'Subtract (zero)'},visual:eqv(`${n} − 0 = ?`),choices:numCh(n,0,20),cols:4}}
/* shapes */
const S2D={triangle:{ar:'المثلث',en:'Triangle',svg:'<svg class="shape" viewBox="0 0 120 120"><polygon points="60,12 108,100 12,100" fill="#ff7a59"/></svg>'},
 square:{ar:'المربّع',en:'Square',svg:'<svg class="shape" viewBox="0 0 120 120"><rect x="20" y="20" width="80" height="80" fill="#4d9bff"/></svg>'},
 rectangle:{ar:'المستطيل',en:'Rectangle',svg:'<svg class="shape" viewBox="0 0 120 120"><rect x="8" y="30" width="104" height="60" fill="#3ddc97"/></svg>'},
 circle:{ar:'الدائرة',en:'Circle',svg:'<svg class="shape" viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="#ffc83d"/></svg>'}};
const shpCh=(M,id,ok)=>ch(()=>M[id].svg.replace('class="shape"','class="shape" style="width:84px;height:84px"')+dualHTML(M[id].ar+'|'+M[id].en),ok);
const tfCh=a=>[ch(D('صح|True'),a),ch(D('خطأ|False'),!a)];
function shp2name(){const ids=Object.keys(S2D),id=pick(ids);return{key:'s2n:'+id,title:{ar:'ما اسم هذا الشكل المسطّح (2D)؟',en:'What is the name of this 2D shape?'},visual:S2D[id].svg,choices:shuffle(ids).map(i=>ch(D(S2D[i].ar+'|'+S2D[i].en),i===id)),cols:2}}
function shp2prop(){const ids=Object.keys(S2D),t=rnd(0,4);
 if(t<2){const id=pick(['triangle','square','rectangle']),v=id==='triangle'?3:4;return{key:'s2c:'+t+id,title:{ar:t?`كم رأسًا (زاوية) في ${S2D[id].ar}؟`:`كم ضلعًا في ${S2D[id].ar}؟`,en:t?`How many vertices (corners) does a ${S2D[id].en.toLowerCase()} have?`:`How many sides does a ${S2D[id].en.toLowerCase()} have?`},visual:S2D[id].svg,choices:numCh(v,0,6),cols:4}}
 const Q=[{ar:'أيّ شكل له ٣ أضلاع؟',en:'Which 2D shape has 3 sides?',a:'triangle'},{ar:'أيّ شكل له ٤ أضلاع متساوية؟',en:'Which 2D shape has 4 equal sides?',a:'square'},{ar:'أيّ شكل ليس له رؤوس (زوايا)؟',en:'Which 2D shape has no vertices (corners)?',a:'circle'}];
 if(t===4)return{key:'s2tf'+rnd(0,1),title:{ar:'صح أم خطأ؟',en:'True or false?'},visual:`<div class="word ltr" style="font-size:36px">2D shapes are flat.</div>`,choices:tfCh(true),cols:2};
 const q=Q[t-2];return{key:'s2w:'+q.a,title:{ar:q.ar,en:q.en},visual:'<div class="em">🤔</div>',choices:shuffle(ids).map(i=>shpCh(S2D,i,i===q.a)),cols:2}}
function shp3name(){const ids=Object.keys(SHAPES),id=pick(ids);return{key:'s3n:'+id,title:{ar:'ما اسم هذا الشكل المجسّم (3D)؟',en:'What is the name of this 3D shape?'},visual:SHAPES[id].svg,choices:shuffle(ids).map(i=>ch(D(SHAPES[i].ar+'|'+SHAPES[i].en),i===id)),cols:2}}

/* turn a finished hero drawing into a colour-me outline: every coloured shape becomes tappable (class r) */
function colorize(svg){
 const lum=f=>{const m=/^#([0-9a-f]{6})$/i.exec(f);if(!m)return 255;const n=parseInt(m[1],16);return((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000};
 let t=svg.replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'').replace(/<defs>[\s\S]*?<\/defs>/,'');
 t=t.replace(/<(rect|circle|ellipse|polygon|path)\b([^>]*?)(\/?)>/g,(m,tag,a,sl)=>{
  if(/\sopacity="/.test(a))return '';                      // highlights, cheeks, shading are drawn only in the finished art
  const f=(a.match(/\sfill="([^"]*)"/)||[])[1];
  if(!f||f==='none')return m;                             // line work stays
  if(lum(f)<72)return m;                                  // eyes, tyres, mouths stay dark
  const r=a.match(/\sr="([\d.]+)"/);if(r&&+r[1]<=3)return m;
  a=a.replace(/\sfill="[^"]*"/,'').replace(/\sstroke(-width|-linejoin|-linecap)?="[^"]*"/g,'');
  return `<${tag} class="r"${a}${sl}>`});
 t=t.replace(/(<text[^>]*?)fill="#fff"/g,'$1fill="#27304d"');
 return '<rect class="r" x="0" y="0" width="200" height="200"/><rect class="r" x="0" y="178" width="200" height="22"/>'+t}
